name: Avisar Observatório

# Copie este arquivo para .github/workflows/avisar-observatorio.yml no sistema.
# Ele só comunica metadados de um push. Não grava no sistema, no Monday nem no Drive.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  avisar:
    # Evita um ciclo caso alguma automação do próprio sistema faça um commit.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      # Troque pelo nome EXATO cadastrado em sistemas.json.
      SISTEMA_NOME: micro-classificador-v1
      OBSERVATORIO_TOKEN: ${{ secrets.OBSERVATORIO_TOKEN }}
    steps:
      - name: Enviar sinal ao painel e ao Diário
        shell: bash
        run: |
          if [ -z "$OBSERVATORIO_TOKEN" ]; then
            echo "::warning::OBSERVATORIO_TOKEN não configurado. O push continua normal; o Observatório será atualizado pela coleta horária."
            exit 0
          fi

          painel=$(jq -nc \
            --arg sistema "$SISTEMA_NOME" \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg sha "$GITHUB_SHA" \
            --arg autor "$GITHUB_ACTOR" \
            '{event_type: "sistema-atualizado", client_payload: {sistema: $sistema, repo: $repo, sha: $sha, autor: $autor}}')
          diario=$(jq -nc \
            --arg sistema "$SISTEMA_NOME" \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg sha "$GITHUB_SHA" \
            --arg autor "$GITHUB_ACTOR" \
            '{event_type: "fonte-atualizada", client_payload: {sistema: $sistema, repo: $repo, sha: $sha, autor: $autor}}')

          for body in "$painel" "$diario"; do
            curl --fail --silent --show-error --retry 2 \
              -X POST \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $OBSERVATORIO_TOKEN" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              https://api.github.com/repos/GabeBrain/observatorio/dispatches \
              -d "$body"
          done

          echo "Aviso enviado ao Observatório."
